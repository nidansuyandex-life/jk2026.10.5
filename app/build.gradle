plugins {
    id 'com.android.application'
}

android {
    namespace 'com.healthlife.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.healthlife.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/*.kotlin_module']
        }
    }

    sourceSets {
        main { jniLibs.srcDirs = ['libs'] }
    }
}

/* ★ 关键：把旧版 kotlin-stdlib-jdk7/jdk8 从所有依赖链里排除掉
   （aar 会通过传递依赖把它们拉进来，而不是直接打包在 aar 里） */
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
}

dependencies {
    /* ★ 这里不要再写 exclude 了 —— 会报 "Could not find method exclude()" */
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.8.0'

    /* ★ 统一显式指定 kotlin-stdlib，防止被旧版本顶掉 */
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
